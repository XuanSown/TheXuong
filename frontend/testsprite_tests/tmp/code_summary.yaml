version: "2"
type: "frontend"
tech_stack:
  - TypeScript
  - Vue 3 (Composition API, script setup)
  - Tailwind CSS 3.x
  - Pinia 2.x (state management)
  - Vue Router 4.x
  - Axios (HTTP client, withCredentials, CSRF token)
  - VeeValidate + Zod (form validation)
  - Vite 8.x (build tool)
  - vue-toastification (notifications)
  - Swiper 12.x (carousels)
routes:
  - path: /
    file: src/views/Home.vue
    auth_required: false
    description: Homepage with hero banner and new products
  - path: /products
    file: src/views/Products.vue
    auth_required: false
    description: Product listing with search, filter by sport/brand, and sort
  - path: /product-detail/:id
    file: src/views/ProductDetail.vue
    auth_required: false
    description: Product detail page with variant selection, reviews, add to cart
  - path: /cart
    file: src/views/Cart.vue
    auth_required: false
    description: Shopping cart with quantity update and remove (guest cart supported)
  - path: /checkout
    file: src/views/Checkout.vue
    auth_required: true
    description: Checkout page with shipping info, voucher apply, VNPay payment redirect
  - path: /orders
    file: src/views/Orders.vue
    auth_required: true
    description: User order history list
  - path: /order/:id
    file: src/views/OrderDetail.vue
    auth_required: true
    description: Order detail with cancel option
  - path: /profile
    file: src/views/Profile.vue
    auth_required: true
    description: User profile edit and change password
  - path: /favorite
    file: src/views/Favorite.vue
    auth_required: true
    description: Wishlist of favorite products
  - path: /my-rewards
    file: src/views/MyRewards.vue
    auth_required: true
    description: Loyalty points balance, history, voucher catalog and redemption
  - path: /login
    file: src/views/Login.vue
    auth_required: false
    description: Login page with email/password and Google OAuth2 (guest only)
  - path: /register
    file: src/views/Register.vue
    auth_required: false
    description: Registration page (guest only)
  - path: /forgot-password
    file: src/views/ForgotPassword.vue
    auth_required: false
    description: Forgot password request page (guest only)
  - path: /reset-password
    file: src/views/ResetPassword.vue
    auth_required: false
    description: Reset password with token page (guest only)
  - path: /oauth/callback
    file: src/views/OAuthCallback.vue
    auth_required: false
    description: OAuth2 callback handler after Google login (guest only)
  - path: /admin/products
    file: src/views/admin/AdminProducts.vue
    auth_required: true
    description: Admin product list with search and pagination (ADMIN role)
  - path: /admin/products/create
    file: src/views/admin/AdminProductEdit.vue
    auth_required: true
    description: Admin create product form with image upload (ADMIN role)
  - path: /admin/products/:id/edit
    file: src/views/admin/AdminProductEdit.vue
    auth_required: true
    description: Admin edit product form (ADMIN role)
  - path: /admin/orders
    file: src/views/admin/AdminOrders.vue
    auth_required: true
    description: Admin order management with status filter and update (ADMIN role)
  - path: /admin/users
    file: src/views/admin/AdminUsers.vue
    auth_required: true
    description: Admin user management with toggle active and role update (ADMIN role)
  - path: /admin/statistics
    file: src/views/admin/AdminStatistics.vue
    auth_required: true
    description: Admin statistics dashboard (ADMIN role)
  - path: /admin/loyalty/vouchers
    file: src/views/admin/AdminVoucher.vue
    auth_required: true
    description: Admin voucher CRUD, bulk actions, and stats (ADMIN role)
  - path: /admin/loyalty/tiers
    file: src/views/admin/AdminTiers.vue
    auth_required: true
    description: Admin tier management and user loyalty progress (ADMIN role)
features:
  - name: User Login
    description: Login with email and password credentials or Google OAuth2
    files:
      - src/views/Login.vue
      - src/stores/auth.store.ts
      - src/services/api.ts
    entry_route: /login
    user_interactions:
      - Fill email input field
      - Fill password input field
      - Toggle password visibility with eye icon
      - Click "DANG NHAP" submit button to login
      - Click "Dang nhap bang Google" button for OAuth2 redirect
      - Click "Quen mat khau?" link to go to forgot password
      - Click "Dang ky ngay" link to go to registration
      - See error toast notification on invalid credentials
    api_calls:
      - method: POST
        endpoint: /auth/login
      - method: GET
        endpoint: /auth/user
    auth_required: false
  - name: User Registration
    description: Register a new customer account with full name, email, password
    files:
      - src/views/Register.vue
      - src/stores/auth.store.ts
      - src/services/api.ts
      - src/utils/validators.ts
    entry_route: /register
    user_interactions:
      - Fill full name input field
      - Fill email input field
      - Fill password input field
      - Fill confirm password input field
      - Click register submit button
      - See validation errors for invalid input
      - Redirect to login page on success
    api_calls:
      - method: POST
        endpoint: /auth/register
    auth_required: false
  - name: Forgot and Reset Password
    description: Request password reset by email and reset with token
    files:
      - src/views/ForgotPassword.vue
      - src/views/ResetPassword.vue
      - src/services/api.ts
    entry_route: /forgot-password
    user_interactions:
      - Fill email input field on forgot password page
      - Click submit to request reset link
      - Fill new password and confirm password on reset page
      - Click submit to reset password
    api_calls:
      - method: POST
        endpoint: /auth/forgot-password
      - method: POST
        endpoint: /auth/reset-password
    auth_required: false
  - name: Product Browsing and Search
    description: Browse product catalog with keyword search, sport/brand filters, and sorting
    files:
      - src/views/Products.vue
      - src/views/Home.vue
      - src/services/product.service.ts
      - src/services/api.ts
    entry_route: /products
    user_interactions:
      - View product grid with pagination
      - Enter keyword in search input
      - Select sport filter from dropdown
      - Select brand filter from dropdown
      - Select sort option (newest, price ascending, price descending)
      - Click product card to navigate to product detail
    api_calls:
      - method: GET
        endpoint: /products
      - method: GET
        endpoint: /products/new
      - method: GET
        endpoint: /categories/sports
      - method: GET
        endpoint: /categories/brands
    auth_required: false
  - name: Product Detail View
    description: View product details, select size variant, add to cart, add to favorites
    files:
      - src/views/ProductDetail.vue
      - src/services/product.service.ts
      - src/stores/cart.store.ts
      - src/stores/favorite.store.ts
    entry_route: /product-detail/:id
    user_interactions:
      - View product images and description
      - Select size variant from available options
      - Click add to cart button
      - Click favorite heart icon to toggle wishlist
      - View product reviews and ratings
    api_calls:
      - method: GET
        endpoint: /products/:id
    auth_required: false
  - name: Shopping Cart
    description: View and manage cart items, update quantities, proceed to checkout
    files:
      - src/views/Cart.vue
      - src/stores/cart.store.ts
      - src/services/cart.service.ts
    entry_route: /cart
    user_interactions:
      - View list of cart items with subtotal
      - Increase or decrease item quantity
      - Remove item from cart
      - Click proceed to checkout button
    api_calls:
      - method: GET
        endpoint: /cart
      - method: POST
        endpoint: /cart/items
      - method: PUT
        endpoint: /cart/items/:id
      - method: DELETE
        endpoint: /cart/items/:id
    auth_required: false
  - name: Checkout and Payment
    description: Fill shipping information, apply voucher, place order via VNPay payment gateway
    files:
      - src/views/Checkout.vue
      - src/services/order.service.ts
    entry_route: /checkout
    user_interactions:
      - Fill shipping full name input
      - Fill shipping phone number input
      - Fill shipping address input
      - Enter voucher code and click apply
      - Click place order button
      - Redirect to VNPay payment URL
    api_calls:
      - method: POST
        endpoint: /orders
    auth_required: true
  - name: Order History and Detail
    description: View past orders and order details, cancel pending orders
    files:
      - src/views/Orders.vue
      - src/views/OrderDetail.vue
      - src/services/order.service.ts
    entry_route: /orders
    user_interactions:
      - View list of past orders with status badges
      - Click order to view detail
      - Click cancel button on pending order
    api_calls:
      - method: GET
        endpoint: /orders
      - method: GET
        endpoint: /orders/:id
      - method: POST
        endpoint: /orders/:id/cancel
    auth_required: true
  - name: User Profile Management
    description: View and edit profile information, change password
    files:
      - src/views/Profile.vue
      - src/stores/auth.store.ts
      - src/services/api.ts
    entry_route: /profile
    user_interactions:
      - View current profile information
      - Edit full name field
      - Edit phone number field
      - Edit address field
      - Click save profile button
      - Fill current password and new password to change password
    api_calls:
      - method: GET
        endpoint: /auth/user
      - method: PUT
        endpoint: /auth/profile
      - method: PUT
        endpoint: /auth/password
    auth_required: true
  - name: Loyalty Rewards and Voucher Redemption
    description: View loyalty points balance, history, owned vouchers, and redeem vouchers from catalog
    files:
      - src/views/MyRewards.vue
      - src/services/loyaltyService.ts
    entry_route: /my-rewards
    user_interactions:
      - View current points balance
      - View points transaction history
      - View owned vouchers with status (unused, used, expired)
      - Browse voucher catalog with points cost
      - Click redeem button to exchange points for voucher
    api_calls:
      - method: GET
        endpoint: /loyalty/points
      - method: GET
        endpoint: /loyalty/history
      - method: GET
        endpoint: /my-vouchers
      - method: GET
        endpoint: /loyalty/catalog
      - method: POST
        endpoint: /loyalty/redeem
    auth_required: true
  - name: Admin Product Management
    description: Admin can list, create, edit, soft-delete, and toggle active status of products with image upload
    files:
      - src/views/admin/AdminProducts.vue
      - src/views/admin/AdminProductEdit.vue
      - src/services/admin.service.ts
      - src/services/api.ts
    entry_route: /admin/products
    user_interactions:
      - View admin product list with pagination and search
      - Click create product button
      - Fill product name, description, price, sport, brand, category fields
      - Upload product images (1 to 5 files)
      - Configure size quantities for variants
      - Click save to create or update product
      - Click delete to soft-delete product
      - Click toggle active to activate or deactivate product
    api_calls:
      - method: GET
        endpoint: /admin/products
      - method: GET
        endpoint: /admin/products/:id
      - method: POST
        endpoint: /admin/products
      - method: PUT
        endpoint: /admin/products/:id
      - method: DELETE
        endpoint: /admin/products/:id
      - method: PATCH
        endpoint: /admin/products/:id/toggle-active
      - method: GET
        endpoint: /admin/products/size-catalog
    auth_required: true
  - name: Admin Order Management
    description: Admin can view all orders, filter by status, and update order status
    files:
      - src/views/admin/AdminOrders.vue
      - src/services/admin.service.ts
    entry_route: /admin/orders
    user_interactions:
      - View all orders list with status filter
      - Search orders by keyword
      - Select new status for an order
      - Click update status button
    api_calls:
      - method: GET
        endpoint: /admin/orders
      - method: PATCH
        endpoint: /admin/orders/:id/status
    auth_required: true
  - name: Admin User Management
    description: Admin can view users, toggle active status, update roles, and create users
    files:
      - src/views/admin/AdminUsers.vue
      - src/services/admin.service.ts
    entry_route: /admin/users
    user_interactions:
      - View user list
      - Click toggle active to enable or disable user
      - Select role for user (CUSTOMER, ADMIN, BOTH)
      - Click create user button and fill form
    api_calls:
      - method: GET
        endpoint: /admin/users
      - method: PATCH
        endpoint: /admin/users/:id/toggle-active
      - method: PATCH
        endpoint: /admin/users/:id/role
      - method: POST
        endpoint: /admin/users
    auth_required: true
  - name: Admin Statistics Dashboard
    description: Admin can view statistics dashboard with revenue, orders, and product metrics
    files:
      - src/views/admin/AdminStatistics.vue
      - src/services/admin.service.ts
    entry_route: /admin/statistics
    user_interactions:
      - View statistics cards and charts
      - View revenue and order metrics
    api_calls:
      - method: GET
        endpoint: /admin/statistics
    auth_required: true
  - name: Admin Voucher Management
    description: Admin can CRUD vouchers, perform bulk actions, and view voucher statistics
    files:
      - src/views/admin/AdminVoucher.vue
      - src/services/voucherService.ts
    entry_route: /admin/loyalty/vouchers
    user_interactions:
      - View voucher list with filters (status, VIP only, points range)
      - Click create voucher button and fill form
      - Edit voucher details
      - Delete voucher
      - Select multiple vouchers for bulk action (lock, unlock, delete, set VIP)
      - View voucher statistics
    api_calls:
      - method: GET
        endpoint: /admin/loyalty/vouchers
      - method: POST
        endpoint: /admin/loyalty/vouchers
      - method: PUT
        endpoint: /admin/loyalty/vouchers/:id
      - method: DELETE
        endpoint: /admin/loyalty/vouchers/:id
      - method: POST
        endpoint: /admin/loyalty/vouchers/bulk
      - method: GET
        endpoint: /admin/loyalty/vouchers/stats
    auth_required: true
  - name: Admin Tier Management
    description: Admin can manage loyalty tiers, view user loyalty progress, adjust points, and update tiers
    files:
      - src/views/admin/AdminTiers.vue
      - src/services/tierService.ts
      - src/services/loyaltyAdminService.ts
    entry_route: /admin/loyalty/tiers
    user_interactions:
      - View tier list with thresholds and benefits
      - Create new tier with code, name, min spent, min points
      - Edit tier details
      - Delete tier
      - View user loyalty progress and tier history
      - Adjust user points with note
      - Update user tier with reason
    api_calls:
      - method: GET
        endpoint: /admin/tiers
      - method: POST
        endpoint: /admin/tiers
      - method: PUT
        endpoint: /admin/tiers/:id
      - method: DELETE
        endpoint: /admin/tiers/:id
      - method: GET
        endpoint: /admin/loyalty/users/:id/progress
      - method: GET
        endpoint: /admin/loyalty/users/:id/history
      - method: POST
        endpoint: /admin/loyalty/users/:id/adjust-points
      - method: POST
        endpoint: /admin/loyalty/users/:id/update-tier
    auth_required: true
known_limitations:
  - issue: Google OAuth2 login requires external redirect to Google consent screen which cannot be completed in automated headless testing
    location: src/views/Login.vue
    impact: Only email/password JWT login can be tested automatically, OAuth2 flow must be tested manually
  - issue: VNPay payment redirects to external payment gateway URL which cannot be completed in automated testing
    location: src/views/Checkout.vue
    impact: Order placement can be initiated but payment confirmation cannot be verified automatically
  - issue: Authentication uses session cookie (JSESSIONID) with CSRF token requiring withCredentials and X-CSRF-TOKEN header
    location: src/services/api.ts
    impact: Test framework must preserve cookies across requests and handle CSRF token for mutating operations
  - issue: Admin-only routes redirect pure admin users away from customer pages and vice versa
    location: src/router/index.ts
    impact: Test must use appropriate role credentials (ADMIN vs CUSTOMER) for each route under test
