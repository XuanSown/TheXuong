spring.application.name=TheXuong
server.port=8080
spring.datasource.url=jdbc:sqlserver://localhost:1444;databaseName=dbTheXuong;encrypt=false;sendStringParametersAsUnicode=true
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=none
#khi dev true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
#map sang c\u1ED9t nvarchar
spring.jpa.properties.hibernate.use_nationalized_character_data=true 
logging.level.org.hibernate=warn
#khi dev debug
logging.level.org.hibernate.SQL=off
#khi dev trace
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=off 
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# C\u1EA5u h\u00ECnh g\u1EEDi mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tranxuanson9423@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#B\u1EA3o m\u1EADt SESSION COOKIE
# 1. Ch\u1ED1ng XSS
server.servlet.session.cookie.http-only=true
# 2. B\u1EAFt bu\u1ED9c cookie ch\u1EC9 g\u1EEDi qua m\u1EA1ng m\u00E3 h\u00F3a HTTPS (Ch\u1ED1ng MitM)
server.servlet.session.cookie.secure=true
# 3. Ch\u1ED1ng t\u1EA5n c\u00F4ng CSRF
server.servlet.session.cookie.same-site=lax
# Trust Cloudflare Tunnel + Vite proxy headers (X-Forwarded-*).
# Dung framework strategy (ForwardedHeaderFilter) thay vi native (Tomcat RemoteIpValve),
# vi Tomcat chi chap nhan regex cho trusted-proxies/internal-proxies, khong chap nhan CIDR.
# ponytail: framework khong loc theo proxy IP -> luon phan tich X-Forwarded-*.
server.forward-headers-strategy=framework

# JWT Auth (httpOnly cookie)
app.security.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-in-prod-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}
app.security.jwt.access-ttl-seconds=900
app.security.jwt.refresh-ttl-seconds=604800
app.security.jwt.cookie-domain=
app.security.jwt.cookie-secure=true
app.security.jwt.cookie-same-site=lax

# T\u1EAFt warning v\u00F4 h\u1EA1i do t\u1EF1 qu\u1EA3n l\u00FD AuthenticationProvider bean (formLogin \u0111\u00E3 b\u1ECF)
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR