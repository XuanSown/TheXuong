app:
  frontend:
    url: https://thexuong.xuansown.id.vn
  cors:
    # Comma-separated list of allowed origins for CORS
    # Production: replace with real domains, e.g. https://thexuong.com,https://www.thexuong.com
    allowed-origins: https://thexuong.xuansown.id.vn,http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:8080

  cloudflare:
    r2:
      endpoint: https://e1171a0fa6f3c8a1dd3c702025523585.r2.cloudflarestorage.com
      access-key: ${CF_R2_ACCESS_KEY}
      secret-key: ${CF_R2_SECRET_KEY}
      bucket-name: the-xuong-media
      public-url: https://pub-3fbae0ca10794f42ad228e5d2cf7ce04.r2.dev # Đường dẫn subdomain public ảnh

  google:
    maps:
      api-key: ${GOOGLE_MAPS_API_KEY:}
      language: vi
      region: vn

spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
        provider:
          google:
            user-name-attribute: email

chatbot:
  api:
    # Shared secret giữa n8n và backend cho /api/v1/chatbot/orders/track
    # n8n gửi header X-Chatbot-Secret: {{$env.CHATBOT_API_SECRET}}
    secret: ${CHATBOT_API_SECRET:}
