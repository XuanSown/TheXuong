<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Voucher - Admin TheXuong</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/admin}"><i class="fa-solid fa-gauge me-2"></i>Admin Panel</a>
        <a th:href="@{/admin/loyalty/vouchers}" class="btn btn-sm btn-outline-light active">Voucher</a>
    </div>
</nav>

<div class="container my-4">
    <h3 class="mb-4"><i class="fa-solid fa-ticket me-2"></i>Quản lý Voucher Catalog</h3>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- Form tạo/sửa -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-warning text-dark">
            <h5 class="mb-0">Thêm / Sửa Voucher</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/loyalty/vouchers/save}" th:object="${formVoucher}" method="post">
                <input type="hidden" th:field="*{id}"/>
                <input type="hidden" th:field="*{code}" th:value="'TX-CAT-' + *{discountAmount}"/>

                <div class="row g-2">
                    <div class="col-md-3">
                        <label class="form-label">Mệnh giá (VND) <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" th:field="*{discountAmount}" min="0" step="1000" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Số điểm cần <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" th:field="*{requiredPoints}" min="1" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Đơn tối thiểu (VND)</label>
                        <input type="number" class="form-control" th:field="*{minOrderAmount}" min="0" step="1000">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Trạng thái</label>
                        <select class="form-select" th:field="*{status}">
                            <option value="ACTIVE">ACTIVE</option>
                            <option value="LOCKED">LOCKED</option>
                            <option value="EXPIRED">EXPIRED</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" th:field="*{vipOnly}" id="vipOnly">
                            <label class="form-check-label" for="vipOnly">VIP Only</label>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-warning mt-3">
                    <i class="fa-solid fa-save me-1"></i>Lưu
                </button>
            </form>
        </div>
    </div>

    <!-- Bảng danh sách -->
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">Danh sách Voucher Catalog (<span th:text="${#lists.size(vouchers)}">0</span>)</h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Mã catalog</th>
                        <th>Mệnh giá</th>
                        <th>Điểm cần</th>
                        <th>Đơn tối thiểu</th>
                        <th>VIP?</th>
                        <th>Trạng thái</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="v : ${vouchers}">
                        <td th:text="${v.id}"></td>
                        <td><code th:text="${v.code}"></code></td>
                        <td class="text-danger fw-bold"
                            th:text="${#numbers.formatDecimal(v.discountAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                        <td><span class="badge bg-warning text-dark" th:text="${v.requiredPoints}"></span></td>
                        <td th:text="${v.minOrderAmount != null ? #numbers.formatDecimal(v.minOrderAmount, 0, 'COMMA', 0, 'POINT') + ' đ' : '—'}"></td>
                        <td>
                            <span th:if="${v.vipOnly}" class="badge bg-danger">VIP</span>
                            <span th:unless="${v.vipOnly}" class="badge bg-secondary">All</span>
                        </td>
                        <td>
                            <span th:switch="${v.status.name()}">
                                <span th:case="'ACTIVE'" class="badge bg-success">ACTIVE</span>
                                <span th:case="'LOCKED'" class="badge bg-warning text-dark">LOCKED</span>
                                <span th:case="'EXPIRED'" class="badge bg-secondary">EXPIRED</span>
                            </span>
                        </td>
                        <td>
                            <form th:action="@{/admin/loyalty/vouchers/{id}/lock(id=${v.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-warning"
                                        th:title="${v.status.name() == 'LOCKED' ? 'Mở khoá' : 'Khoá'}">
                                    <i class="fa-solid fa-lock" th:if="${v.status.name() != 'LOCKED'}"></i>
                                    <i class="fa-solid fa-unlock" th:if="${v.status.name() == 'LOCKED'}"></i>
                                </button>
                            </form>
                            <form th:action="@{/admin/loyalty/vouchers/{id}/delete(id=${v.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Xoá voucher này?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Xoá">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
