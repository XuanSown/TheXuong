<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi Tiết Đơn Hàng - TheXuong Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-light">

<div class="container py-5">
    <a th:href="@{/admin/orders}" class="btn btn-outline-dark mb-4">
        <i class="fa-solid fa-arrow-left me-2"></i>Quay lại danh sách
    </a>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <div class="row">
        <div class="col-md-8">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-dark text-white fw-bold">
                    Thông Tin Sản Phẩm (Đơn hàng #[[${order.id}]])
                </div>
                <div class="card-body p-0">
                    <table class="table table-striped m-0">
                        <thead>
                        <tr>
                            <th>Sản Phẩm</th>
                            <th>Size</th>
                            <th class="text-center">SL</th>
                            <th class="text-end">Đơn Giá</th>
                            <th class="text-end">Thành Tiền</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="detail : ${order.orderDetails}">
                            <td th:text="${detail.productName}">Tên SP</td>
                            <td th:text="${detail.size}">M</td>
                            <td class="text-center" th:text="${detail.quantity}">1</td>
                            <td class="text-end" th:text="${#numbers.formatDecimal(detail.price, 0, 'POINT', 0, 'COMMA')} + ' đ'"></td>
                            <td class="text-end fw-bold" th:text="${#numbers.formatDecimal(detail.totalPrice, 0, 'POINT', 0, 'COMMA')} + ' đ'"></td>
                        </tr>
                        </tbody>
                        <tfoot class="table-light">
                        <tr>
                            <td colspan="4" class="text-end fw-bold">Tổng Cộng:</td>
                            <td class="text-end fw-bold text-danger fs-5"
                                th:text="${#numbers.formatDecimal(order.totalMoney, 0, 'POINT', 0, 'COMMA')} + ' đ'">
                            </td>
                        </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-secondary text-white fw-bold">
                    Thông Tin Khách Hàng
                </div>
                <div class="card-body">
                    <p class="mb-2"><strong>Họ tên:</strong> <span th:text="${order.fullName}"></span></p>
                    <p class="mb-2"><strong>SĐT:</strong> <span th:text="${order.phoneNumber}"></span></p>
                    <p class="mb-2"><strong>Địa chỉ:</strong> <span th:text="${order.address}"></span></p>
                    <p class="mb-2"><strong>Ngày đặt:</strong> <span th:text="${#temporals.format(order.createdAt, 'dd-MM-yyyy HH:mm')}"></span></p>
                    <p class="mb-0"><strong>Phương thức TT:</strong> <span th:text="${order.paymentMethod}">COD</span></p>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white fw-bold">
                    Cập Nhật Trạng Thái
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/orders/update-status}" method="post">
                        <input type="hidden" name="orderId" th:value="${order.id}">

                        <div class="mb-3">
                            <label class="form-label fw-bold">Trạng thái hiện tại:</label>
                            <select name="status" class="form-select">
                                <option value="PENDING" th:selected="${order.status == 'PENDING'}">PENDING (Chờ xử lý)</option>
                                <option value="SHIPPING" th:selected="${order.status == 'SHIPPING'}">SHIPPING (Đang giao)</option>
                                <option value="DELIVERED" th:selected="${order.status == 'DELIVERED'}">DELIVERED (Đã giao)</option>
                                <option value="CANCELLED" th:selected="${order.status == 'CANCELLED'}">CANCELLED (Đã hủy)</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 fw-bold">
                            <i class="fa-solid fa-floppy-disk me-2"></i>Lưu Thay Đổi
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
