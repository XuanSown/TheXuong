<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Đơn Hàng - TheXuong Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-uppercase fw-bold">Quản Lý Đơn Hàng</h2>
        <a th:href="@{/admin/stats}" class="btn btn-outline-secondary">
            <i class="fa-solid fa-chart-line me-2"></i>Xem Thống Kê
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover table-striped m-0 align-middle">
                <thead class="table-dark">
                <tr>
                    <th>Mã ĐH</th>
                    <th>Khách Hàng</th>
                    <th>Ngày Đặt</th>
                    <th>Tổng Tiền</th>
                    <th>Trạng Thái</th>
                    <th class="text-center">Hành Động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders}">
                    <td class="fw-bold" th:text="'#' + ${order.id}">#1</td>
                    <td>
                        <div class="fw-bold" th:text="${order.fullName}">Tên KH</div>
                        <small class="text-muted" th:text="${order.phoneNumber}">0909...</small>
                    </td>
                    <td th:text="${#temporals.format(order.createdAt, 'dd-MM-yyyy HH:mm')}"></td>
                    <td class="fw-bold text-danger"
                        th:text="${#numbers.formatDecimal(order.totalMoney, 0, 'POINT', 0, 'COMMA')} + ' đ'">
                    </td>
                    <td>
                        <span class="badge"
                              th:classappend="${order.status == 'PENDING' ? 'bg-warning text-dark' :
                                              (order.status == 'SHIPPING' ? 'bg-primary' :
                                              (order.status == 'DELIVERED' ? 'bg-success' : 'bg-danger'))}"
                              th:text="${order.status}">
                        </span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{/admin/orders/detail/{id}(id=${order.id})}" class="btn btn-sm btn-primary">
                            <i class="fa-solid fa-eye"></i> Xem
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
