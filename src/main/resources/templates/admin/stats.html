<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thống Kê - TheXuong Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="text-uppercase fw-bold mb-4 text-center">Bảng Thống Kê Hệ Thống</h2>

    <div class="row g-3 mb-5">
        <div class="col-md-4">
            <div class="card text-white bg-primary h-100 shadow-sm">
                <div class="card-body text-center">
                    <h5 class="card-title text-uppercase">Tổng Doanh Thu</h5>
                    <h3 class="fw-bold display-6" th:text="${#numbers.formatDecimal(totalRevenue, 0, 'POINT', 0, 'COMMA')} + ' đ'">0 đ</h3>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-white bg-success h-100 shadow-sm">
                <div class="card-body text-center">
                    <h5 class="card-title text-uppercase">Đơn Hàng</h5>
                    <h3 class="fw-bold display-6" th:text="${totalOrders}">0</h3>
                    <small>Đơn hàng trên hệ thống</small>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-white bg-warning h-100 shadow-sm">
                <div class="card-body text-center">
                    <h5 class="card-title text-uppercase text-dark">Tổng Tồn Kho</h5>
                    <h3 class="fw-bold display-6 text-dark" th:text="${totalStock}">0</h3>
                    <small class="text-dark">Sản phẩm sẵn sàng bán</small>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header fw-bold bg-success text-white">
                    Top 5 Bán Chạy Nhất
                </div>
                <div class="card-body p-0">
                    <table class="table table-striped m-0">
                        <thead>
                        <tr>
                            <th>Tên Sản Phẩm</th>
                            <th class="text-center">Đã Bán</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${topProducts}">
                            <td th:text="${item[0]}">Tên SP</td>
                            <td class="text-center fw-bold text-success" th:text="${item[1]}">0</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header fw-bold bg-warning text-dark">
                    Top 5 Ít Người Mua
                </div>
                <div class="card-body p-0">
                    <table class="table table-striped m-0">
                        <thead>
                        <tr>
                            <th>Tên Sản Phẩm</th>
                            <th class="text-center">Đã Bán</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${leastProducts}">
                            <td th:text="${item[0]}">Tên SP</td>
                            <td class="text-center fw-bold text-muted" th:text="${item[1]}">0</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
