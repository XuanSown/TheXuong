<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quên mật khẩu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

<div class="card shadow p-4" style="max-width: 400px; width: 100%;">
    <div class="text-center mb-4">
        <h3 class="fw-bold text-uppercase"><i class="fa-solid fa-lock me-2"></i>Quên mật khẩu?</h3>
        <p class="text-muted">Nhập email của bạn để nhận mật khẩu mới.</p>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <form th:action="@{/forgot-password}" method="post">
        <div class="mb-3">
            <label class="form-label fw-bold">Địa chỉ Email</label>
            <input type="email" name="email" class="form-control" placeholder="nhap@email.com" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 fw-bold">
            <i class="fa-solid fa-paper-plane me-2"></i>Gửi mật khẩu mới
        </button>
    </form>

    <div class="text-center mt-3">
        <a th:href="@{/login}" class="text-decoration-none">
            <i class="fa-solid fa-arrow-left"></i> Quay lại đăng nhập
        </a>
    </div>
</div>


<!-- Khung Bot AI Widget -->
<div class="bot-widget-container" id="botWidget">
    <!-- Popup Menu -->
    <div class="bot-menu-popup" id="botMenuPopup">
        <div class="bot-header">
            <h5>TheXuong AI Bot</h5>
            <p>Trợ lý thông minh 24/7</p>
        </div>
        <div class="bot-options">
            <a th:href="@{/pages/size-guide}" class="bot-option-btn">
                <span>Hướng dẫn chọn size giày</span>
                <i class="fa-solid fa-link text-muted"></i>
            </a>
            <a th:href="@{/pages/order-tracking}" class="bot-option-btn">
                <span>Tra cứu trạng thái đơn hàng</span>
                <i class="fa-solid fa-link text-muted"></i>
            </a>
            <a th:href="@{/pages/return-policy}" class="bot-option-btn">
                <span>Chính sách đổi trả 30 ngày</span>
                <i class="fa-solid fa-link text-muted"></i>
            </a>
            <a href="javascript:void(0)" onclick="openTelegramBot('Gặp nhân viên tư vấn')" class="bot-option-btn">
                <span>Gặp nhân viên tư vấn qua Telegram</span>
                <i class="fa-brands fa-telegram text-primary fs-5"></i>
            </a>
        </div>
    </div>
    
    <!-- Nút Float Toggle -->
    <button class="telegram-float-toggle" onclick="toggleBotMenu()" title="Mở danh sách câu hỏi AI">
        <i class="fa-solid fa-robot"></i>
    </button>
</div>

<script>
    function toggleBotMenu() {
        const widget = document.getElementById('botWidget');
        const popup = document.getElementById('botMenuPopup');
        widget.classList.toggle('open');
        popup.classList.toggle('active');
    }

    function openTelegramBot(message) {
        // Thay YOUR_TELEGRAM_BOT_USERNAME bằng username của bot bạn nhé
        const botUsername = 'TheXuong_tananh_bot';
        const encodedMessage = encodeURIComponent(message);
        const url = `https://t.me/${botUsername}?text=${encodedMessage}`;
        window.open(url, '_blank');
        toggleBotMenu(); // Đóng menu sau khi click
    }
</script>
</body>
</html>
