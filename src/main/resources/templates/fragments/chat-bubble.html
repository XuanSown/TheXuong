<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!--
    Fragment: chat-bubble
    Nhúng vào các trang bằng: th:replace="~{fragments/chat-bubble :: chatBubble}"
    Chỉ hiển thị khi người dùng đã đăng nhập.
-->

<th:block th:fragment="chatBubble" sec:authorize="isAuthenticated()">
    <style>
        /* ---------------------------------------- */
        /* Chat Bubble Container                    */
        /* ---------------------------------------- */
        #chat-bubble-app {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 9999;
            font-family: 'Segoe UI', 'Inter', sans-serif;
        }

        /* ---- Toggle Button (Nút hình tròn) ---- */
        .chat-toggle-btn {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #1a1a1a; /* Đen bóng */
            border: 2px solid #ffc107; /* Viền Vàng */
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(255, 193, 7, 0.3);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            position: relative;
            outline: none;
        }

        .chat-toggle-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 25px rgba(255, 193, 7, 0.5);
        }

        .chat-toggle-btn svg {
            width: 26px;
            height: 26px;
            fill: #ffc107; /* Icon Vàng */
            transition: transform 0.3s ease;
        }

        .chat-unread-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #ffc107; /* Nền Vàng */
            color: #000; /* Chữ Đen */
            font-size: 10px;
            font-weight: 700;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #1a1a1a;
            animation: badge-pulse 1.5s infinite;
        }

        @keyframes badge-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* ---- Chat Window ---- */
        .chat-window {
            position: absolute;
            bottom: 70px;
            right: 0;
            width: 360px;
            height: 520px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform-origin: bottom right;
            border: 1px solid #eee;
        }

        .chat-slide-enter-active {
            animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .chat-slide-leave-active {
            animation: slideDown 0.22s ease-in;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: scale(0.85) translateY(20px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes slideDown {
            from { opacity: 1; transform: scale(1) translateY(0); }
            to   { opacity: 0; transform: scale(0.85) translateY(20px); }
        }

        /* ---- Header ---- */
        .chat-header {
            background: #1a1a1a; /* Nền Đen */
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            border-bottom: 2px solid #ffc107; /* Gạch chân Vàng */
        }
        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-header-avatar {
            width: 38px;
            height: 38px;
            background: rgba(255, 193, 7, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            border: 1px solid #ffc107;
        }
        .chat-header-title {
            color: #ffc107; /* Chữ Vàng */
            font-weight: 700;
            font-size: 0.95rem;
            line-height: 1.2;
        }
        .chat-header-subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.72rem;
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
            background: #aaa;
            transition: background 0.3s;
        }
        .status-dot.online {
            background: #2ecc71; /* Giữ xanh lá */
            box-shadow: 0 0 6px #2ecc71;
        }
        .chat-header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .chat-header-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 193, 7, 0.5);
            color: #fff;
            border-radius: 8px;
            padding: 5px 10px;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .chat-header-btn:hover {
            background: #ffc107;
            color: #000;
            border-color: #ffc107;
        }
        .chat-header-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .chat-header-btn.danger {
            background: rgba(255, 80, 80, 0.1);
            border-color: rgba(255, 80, 80, 0.5);
        }
        .chat-header-btn.danger:hover {
            background: #ff4757;
            color: #fff;
            border-color: #ff4757;
        }

        /* ---- Online Panel ---- */
        .online-panel {
            background: #fdfdfd;
            border-bottom: 1px solid #eee;
            padding: 8px 14px;
            flex-shrink: 0;
        }
        .online-panel-title {
            font-size: 0.68rem;
            font-weight: 700;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }
        .online-users-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        .online-user-chip {
            background: #1a1a1a;
            color: #ffc107;
            font-size: 0.68rem;
            font-weight: 600;
            padding: 3px 9px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 4px;
            border: 1px solid #ffc107;
        }
        .online-user-chip::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #2ecc71;
            box-shadow: 0 0 4px #2ecc71;
            flex-shrink: 0;
        }

        /* ---- Messages Area ---- */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 14px 14px 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
            background: #fff;
        }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }

        .msg-system {
            text-align: center;
            font-size: 0.7rem;
            color: #666;
            background: #fffde7;
            border: 1px solid #fff59d;
            border-radius: 20px;
            padding: 3px 12px;
            margin: 2px auto;
            max-width: 80%;
        }

        .msg-wrapper {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        .msg-wrapper.mine { flex-direction: row-reverse; }
        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #ffc107;
            color: #000;
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid #1a1a1a;
        }
        .msg-wrapper.mine .msg-avatar {
            background: #1a1a1a;
            color: #ffc107;
            border: 1px solid #ffc107;
        }
        .msg-body { max-width: 72%; }
        .msg-sender-name {
            font-size: 0.65rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 2px;
            padding-left: 2px;
        }
        .msg-wrapper.mine .msg-sender-name {
            text-align: right;
            padding-right: 2px;
            color: #ffc107;
        }
        .msg-bubble {
            background: #f1f1f1;
            color: #000;
            padding: 9px 13px;
            border-radius: 18px 18px 18px 4px;
            font-size: 0.85rem;
            line-height: 1.45;
            word-break: break-word;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .msg-wrapper.mine .msg-bubble {
            background: #1a1a1a;
            color: #fff;
            border-radius: 18px 18px 4px 18px;
            border-left: 3px solid #ffc107;
        }

        .chat-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 0.82rem;
            gap: 8px;
        }
        .chat-empty-icon { font-size: 2.2rem; }

        .chat-disconnected-overlay {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 0.82rem;
            gap: 12px;
            background: #fdfdfd;
        }
        .chat-disconnected-overlay .icon { font-size: 2.5rem; color: #ffc107; }

        /* ---- Input Area ---- */
        .chat-input-area {
            padding: 10px 12px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 8px;
            align-items: flex-end;
            flex-shrink: 0;
            background: #fff;
        }
        .chat-input {
            flex: 1;
            border: 1.5px solid #e0e0e0;
            border-radius: 22px;
            padding: 9px 16px;
            font-size: 0.85rem;
            outline: none;
            resize: none;
            max-height: 80px;
            line-height: 1.4;
            transition: border-color 0.2s;
            background: #fff;
        }
        .chat-input:focus { border-color: #ffc107; }
        .chat-input:disabled { background: #f5f5f5; color: #aaa; }

        .chat-send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ffc107;
            border: none;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(255, 193, 7, 0.3);
        }
        .chat-send-btn:hover:not(:disabled) { transform: scale(1.1); background: #ffb300; }
        .chat-send-btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
        .chat-send-btn svg { width: 18px; height: 18px; fill: #000; }

        @media (max-width: 480px) {
            .chat-window { width: calc(100vw - 32px); height: 65vh; right: 0; }
            #chat-bubble-app { right: 16px; bottom: 16px; }
        }
    </style>

    <div id="chat-bubble-app">
        <button class="chat-toggle-btn" id="chatToggleBtn" @click="toggleChat" title="Community Chat">
            <svg v-if="!isOpen" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z" />
            </svg>
            <svg v-else viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
            </svg>
            <span class="chat-unread-badge" v-if="!isOpen && unreadCount > 0">{{ unreadCount }}</span>
        </button>

        <transition name="chat-slide">
            <div class="chat-window" v-if="isOpen">
                <!-- Header -->
                <div class="chat-header">
                    <div class="chat-header-info">
                        <div class="chat-header-avatar">💬</div>
                        <div>
                            <div class="chat-header-title">TheXuong Chat</div>
                            <div class="chat-header-subtitle">
                                <span class="status-dot" :class="{ online: isConnected }"></span>
                                <span v-if="isConnected">{{ onlineUsers.length }} thành viên online</span>
                                <span v-else>Chưa kết nối</span>
                            </div>
                        </div>
                    </div>
                    <div class="chat-header-actions">
                        <button class="chat-header-btn" id="chatConnectBtn" @click="connect" :disabled="isConnected">
                            🔌 Kết nối
                        </button>
                        <button class="chat-header-btn danger" id="chatDisconnectBtn" @click="disconnect" :disabled="!isConnected">
                            ✕ Thoát
                        </button>
                    </div>
                </div>

                <!-- Online Users Panel -->
                <div class="online-panel" v-if="isConnected && onlineUsers.length > 0">
                    <div class="online-panel-title">🟢 Đang online</div>
                    <div class="online-users-list">
                        <div class="online-user-chip" v-for="user in onlineUsers" :key="user">
                            {{ user }}
                        </div>
                    </div>
                </div>

                <!-- Messages -->
                <div class="chat-messages" ref="messagesContainer" v-if="isConnected">
                    <div v-if="messages.length === 0" class="chat-empty">
                        <div class="chat-empty-icon">👋</div>
                        <span>Hãy là người đầu tiên gửi tin nhắn!</span>
                    </div>
                    <template v-for="(msg, index) in messages" :key="index">
                        <div v-if="msg.type !== 'CHAT'" class="msg-system">
                            {{ msg.content }}
                        </div>
                        <div v-else class="msg-wrapper" :class="{ mine: msg.sender === currentUser }">
                            <div class="msg-avatar">{{ getInitials(msg.sender) }}</div>
                            <div class="msg-body">
                                <div class="msg-sender-name" v-if="msg.sender !== currentUser">{{ msg.sender }}</div>
                                <div class="msg-bubble">{{ msg.content }}</div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Disconnected Overlay -->
                <div class="chat-disconnected-overlay" v-else>
                    <div class="icon">🔌</div>
                    <span style="font-weight:600; color:#555;">Bạn chưa kết nối</span>
                    <span style="font-size:0.75rem; color:#bbb;">Bấm "Kết nối" để bắt đầu chat</span>
                    <button class="chat-header-btn"
                        style="background: #1a1a1a; color: #ffc107; border: 1px solid #ffc107; padding:8px 22px; border-radius:20px; font-size:0.8rem;"
                        @click="connect">
                        🔌 Kết nối ngay
                    </button>
                </div>

                <!-- Input Area -->
                <div class="chat-input-area" v-if="isConnected">
                    <textarea class="chat-input" id="chatMessageInput" v-model="newMessage"
                        @keydown.enter.exact.prevent="sendMessage" placeholder="Nhập tin nhắn..."
                        rows="1"></textarea>
                    <button class="chat-send-btn" id="chatSendBtn" @click="sendMessage"
                        :disabled="!newMessage.trim()">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                        </svg>
                    </button>
                </div>
            </div>
        </transition>
    </div>

    <!-- JS Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const CHAT_CURRENT_USER = /*[[${#authentication.name}]]*/ 'Anonymous';
        /*]]>*/
    </script>

    <script>
        const STORAGE_KEY = 'chat_messages_' + CHAT_CURRENT_USER;
        function saveMessages(msgs) { sessionStorage.setItem(STORAGE_KEY, JSON.stringify(msgs)); }
        function loadMessages() { const raw = sessionStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : []; }
        function clearMessages() { sessionStorage.removeItem(STORAGE_KEY); }

        const { createApp, ref, nextTick, onMounted } = Vue;
        createApp({
            setup() {
                const isOpen = ref(false);
                const isConnected = ref(false);
                const messages = ref(loadMessages());
                const onlineUsers = ref([]);
                const newMessage = ref('');
                const unreadCount = ref(0);
                const currentUser = ref(CHAT_CURRENT_USER);
                const messagesContainer = ref(null);
                let stompClient = null;

                function toggleChat() {
                    isOpen.value = !isOpen.value;
                    if (isOpen.value) { unreadCount.value = 0; scrollToBottom(); }
                }

                function connect() {
                    if (stompClient && stompClient.active) return;
                    const socket = new SockJS('/ws');
                    stompClient = new StompJs.Client({
                        webSocketFactory: () => socket,
                        reconnectDelay: 5000,
                        onConnect: () => {
                            isConnected.value = true;
                            stompClient.subscribe('/topic/public', (message) => {
                                const msg = JSON.parse(message.body);
                                messages.value.push(msg);
                                saveMessages(messages.value);
                                if (msg.onlineUsers) { onlineUsers.value = msg.onlineUsers; }
                                if (!isOpen.value && msg.type === 'CHAT' && msg.sender !== currentUser.value) { unreadCount.value++; }
                                scrollToBottom();
                            });
                            fetch('/api/chat/online-users').then(res => res.json()).then(users => { onlineUsers.value = users; });
                        },
                        onDisconnect: () => { isConnected.value = false; onlineUsers.value = []; },
                    });
                    stompClient.activate();
                }

                function disconnect() {
                    if (stompClient && stompClient.active) { clearMessages(); messages.value = []; stompClient.deactivate(); }
                }

                function sendMessage() {
                    const content = newMessage.value.trim();
                    if (!content || !isConnected.value) return;
                    stompClient.publish({ destination: '/app/chat.sendMessage', body: JSON.stringify({ content: content }) });
                    newMessage.value = '';
                }

                function scrollToBottom() {
                    nextTick(() => { if (messagesContainer.value) messagesContainer.value.scrollTop = messagesContainer.value.scrollHeight; });
                }

                function getInitials(name) {
                    if (!name) return '?';
                    const parts = name.split(/[\s@_.-]+/);
                    return parts.length >= 2 ? (parts[0][0] + parts[1][0]).toUpperCase() : name.substring(0, 2).toUpperCase();
                }

                onMounted(() => { connect(); if (messages.value.length > 0) scrollToBottom(); });

                return { isOpen, isConnected, messages, onlineUsers, newMessage, unreadCount, currentUser, messagesContainer, toggleChat, connect, disconnect, sendMessage, getInitials };
            }
        }).mount('#chat-bubble-app');
    </script>
</th:block>
</html>
