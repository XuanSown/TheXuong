<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - TheXuong Sport</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../static/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="login-container">
    <div class="login-box">
        <div class="login-header">
            <img src="../static/img/logo.png" alt="Logo" width="40" height="40" class="me-2">
            <h2 class="brand-title">THE XUONG</h2>
            <p class="subtitle">Welcome Back!</p>
        </div>

        <div id="errorMsg" class="error-msg"></div>

        <div class="input-group-custom">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input type="text" id="email" placeholder="Email của bạn">
        </div>

        <div class="input-group-custom">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="password" placeholder="Mật khẩu">
        </div>

        <div class="actions">
            <a href="#" class="forgot-pass">Quên mật khẩu?</a>
        </div>

        <button class="btn-login" onclick="handleLogin()">
            ĐĂNG NHẬP <i class="fa-solid fa-arrow-right"></i>
        </button>

        <div class="divider">
            <span>HOẶC</span>
        </div>

        <a href="/oauth2/authorization/google" class="btn-google">
            <i class="fa-brands fa-google" alt="G" width="20"></i>
            Đăng nhập bằng Google
        </a>

        <p class="register-link">
        <p style="margin-top:20px; font-size: 0.9rem;" class="text-center text-muted">
            Chưa có tài khoản?
            <a href="register.html" class="text-dark fw-bold text-decoration-none">Đăng ký ngay</a>
        </p>
        </p>
    </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
