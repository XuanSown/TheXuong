<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đổi voucher - TheXuong</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-light">

<div th:replace="~{index :: nav}"></div>

<div class="container my-5">
    <h2 class="mb-4"><i class="fa-solid fa-gift text-warning me-2"></i>Đổi voucher</h2>

    <!-- Hiển thị số dư -->
    <div class="alert alert-info">
        <i class="fa-solid fa-coins me-1"></i> Bạn có <strong th:text="${currentPoints}">0</strong> điểm.
        <a th:href="@{/loyalty}" class="alert-link">Xem lịch sử</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <!-- Grid 6 mệnh giá -->
    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="v : ${catalog}">
            <div class="card shadow-sm h-100"
                 th:classappend="${currentPoints < v.requiredPoints} ? 'opacity-50' : ''">
                <div class="card-body text-center">
                    <h5 class="text-danger fw-bold"
                        th:text="${#numbers.formatDecimal(v.discountAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                        10.000 đ
                    </h5>
                    <p class="text-muted mb-2">Mệnh giá giảm</p>

                    <hr>

                    <p class="mb-1">
                        <i class="fa-solid fa-coins text-warning"></i>
                        <strong th:text="${v.requiredPoints}">1</strong> điểm
                    </p>
                    <p class="text-muted small mb-2" th:if="${v.minOrderAmount != null}">
                        Đơn tối thiểu:
                        <span th:text="${#numbers.formatDecimal(v.minOrderAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                    </p>
                    <p class="text-muted small mb-2" th:if="${v.vipOnly}">
                        <span class="badge bg-danger">VIP ONLY</span>
                    </p>

                    <form th:action="@{/loyalty/redeem}" method="post" class="mt-3">
                        <input type="hidden" name="voucherId" th:value="${v.id}"/>
                        <button type="submit" class="btn btn-warning w-100"
                                th:disabled="${currentPoints < v.requiredPoints}"
                                onclick="return confirm('Xác nhận đổi ' + ${v.requiredPoints} + ' điểm lấy voucher này?');">
                            <i class="fa-solid fa-exchange-alt me-1"></i>Đổi ngay
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-4 text-center">
        <a th:href="@{/loyalty}" class="btn btn-outline-secondary">
            <i class="fa-solid fa-arrow-left me-1"></i>Quay lại
        </a>
    </div>
</div>

</body>
</html>
