<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Voucher của tôi - TheXuong</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .voucher-card { transition: transform 0.2s; }
        .voucher-card:hover { transform: translateY(-3px); }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{index :: nav}"></div>

<div class="container my-5">
    <h2 class="mb-4"><i class="fa-solid fa-ticket text-warning me-2"></i>Voucher của tôi</h2>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <!-- Tabs -->
    <ul class="nav nav-tabs mb-4">
        <li class="nav-item">
            <a class="nav-link active" data-bs-toggle="tab" href="#unused">
                <i class="fa-solid fa-circle-check text-success me-1"></i>Chưa dùng (<span th:text="${unusedCount}">0</span>)
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" data-bs-toggle="tab" href="#used">
                <i class="fa-solid fa-circle text-secondary me-1"></i>Đã dùng (<span th:text="${usedCount}">0</span>)
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" data-bs-toggle="tab" href="#expired">
                <i class="fa-solid fa-circle-xmark text-danger me-1"></i>Hết hạn (<span th:text="${expiredCount}">0</span>)
            </a>
        </li>
    </ul>

    <div class="tab-content">
        <!-- Tab UNUSED -->
        <div class="tab-pane fade show active" id="unused">
            <div class="row row-cols-1 row-cols-md-2 g-3">
                <div class="col" th:each="v : ${vouchers}" th:if="${v.status.name() == 'UNUSED'}">
                    <div class="card voucher-card border-success">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <h5 class="text-danger fw-bold mb-2"
                                    th:text="${v.code}">TX-ABCDEF</h5>
                                <span class="badge bg-success">UNUSED</span>
                            </div>
                            <p class="text-muted mb-1">
                                <i class="fa-solid fa-calendar me-1"></i>
                                Hết hạn: <strong th:text="${#temporals.format(v.expiresAt, 'dd/MM/yyyy')}"></strong>
                            </p>
                            <a th:href="@{/checkout(voucher=${v.code})}" class="btn btn-warning btn-sm mt-2">
                                <i class="fa-solid fa-cart-shopping me-1"></i>Dùng ngay
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            <div th:if="${unusedCount == 0}" class="text-center text-muted py-5">
                <i class="fa-solid fa-ticket fa-3x mb-3"></i>
                <p>Bạn chưa có voucher nào. <a th:href="@{/loyalty/redeem}">Đổi ngay</a></p>
            </div>
        </div>

        <!-- Tab USED -->
        <div class="tab-pane fade" id="used">
            <div class="row row-cols-1 row-cols-md-2 g-3">
                <div class="col" th:each="v : ${vouchers}" th:if="${v.status.name() == 'USED'}">
                    <div class="card voucher-card border-secondary opacity-75">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <h5 class="text-muted fw-bold mb-2" th:text="${v.code}"></h5>
                                <span class="badge bg-secondary">USED</span>
                            </div>
                            <p class="text-muted small mb-0">
                                Đã dùng: <span th:text="${#temporals.format(v.usedAt, 'dd/MM/yyyy HH:mm')}"></span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab EXPIRED -->
        <div class="tab-pane fade" id="expired">
            <div class="row row-cols-1 row-cols-md-2 g-3">
                <div class="col" th:each="v : ${vouchers}" th:if="${v.status.name() == 'EXPIRED'}">
                    <div class="card voucher-card border-danger opacity-50">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <h5 class="text-muted fw-bold mb-2 text-decoration-line-through" th:text="${v.code}"></h5>
                                <span class="badge bg-danger">EXPIRED</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-4 text-center">
        <a th:href="@{/loyalty/redeem}" class="btn btn-warning">
            <i class="fa-solid fa-gift me-1"></i>Đổi voucher mới
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
