<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tất cả sản phẩm</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid px-5"> <a class="navbar-brand d-flex align-items-center fw-bold text-uppercase" href="index.html">
        <img src="img/logo.png" alt="Logo" width="45" height="45" class="me-2">
        <span class="brand-text">THE XUONG</span>
    </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item dropdown custom-dropdown">
                    <a class="nav-link dropdown-toggle fw-bold text-white" href="#" id="sportDropdown">
                        THỂ THAO
                    </a>
                    <ul class="dropdown-menu dropdown-menu-glass">
                        <li><a class="dropdown-item" href="#"><i class="fa-solid fa-futbol me-2"></i>Bóng đá</a></li>
                        <li><a class="dropdown-item" href="#"><i class="fa-solid fa-feather me-2"></i>Cầu lông</a></li>
                        <li><a class="dropdown-item" href="#"><i class="fa-solid fa-person-running me-2"></i>Chạy bộ</a></li>
                        <li><a class="dropdown-item" href="#"><i class="fa-solid fa-basketball me-2"></i>Bóng rổ</a></li>
                        <li><a class="dropdown-item" href="#"><i class="fa-solid fa-table-tennis-paddle-ball me-2"></i>Pickleball</a></li>
                        <li><a class="dropdown-item" href="#">Khác...</a></li>
                    </ul>
                </li>

                <li class="nav-item dropdown custom-dropdown">
                    <a class="nav-link dropdown-toggle fw-bold text-white" href="#" id="brandDropdown">
                        THƯƠNG HIỆU
                    </a>
                    <ul class="dropdown-menu dropdown-menu-glass">
                        <li><a class="dropdown-item" href="#">Nike</a></li>
                        <li><a class="dropdown-item" href="#">Adidas</a></li>
                        <li><a class="dropdown-item" href="#">Li-Ning</a></li>
                        <li><a class="dropdown-item" href="#">Asics</a></li>
                        <li><a class="dropdown-item" href="#">Puma</a></li>
                        <li><a class="dropdown-item" href="#">Khác...</a></li>
                    </ul>
                </li>

                <li class="nav-item">
                    <a class="nav-link fw-bold text-white" href="/products">
                        TẤT CẢ SẢN PHẨM <span class="badge bg-danger ms-1" style="font-size: 0.6rem;">HOT</span>
                    </a>
                </li>
            </ul>

            <form class="d-flex mx-auto search-form position-relative" role="search" style="width: 350px;">
                <input class="form-control search-input" type="search" placeholder="Tìm tên sản phẩm..." aria-label="Search">
                <button class="btn search-btn position-absolute end-0 top-0 h-100" type="submit">
                    <i class="fa-solid fa-magnifying-glass text-white"></i>
                </button>
            </form>

            <ul class="navbar-nav ms-auto align-items-center gap-3">

                <li class="nav-item dropdown custom-dropdown">
                    <a class="nav-link text-white" href="#" style="font-size: 1.2rem;">
                        <i class="fa-solid fa-earth-americas"></i>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-glass dropdown-menu-end" style="min-width: 100px;">
                        <li><a class="dropdown-item active" href="#">🇻🇳 VN</a></li>
                        <li><a class="dropdown-item" href="#">🇺🇸 EN</a></li>
                    </ul>
                </li>

                <li class="nav-item position-relative">
                    <a class="nav-link text-white" href="#" style="font-size: 1.2rem;">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.6rem;">
                            3 </span>
                    </a>
                </li>

                <li class="nav-item dropdown custom-dropdown" id="userArea">
                </li>
            </ul>

        </div>
    </div>
</nav>
<div class="container">
    <h2 class="mb-4 text-center">Danh sách sản phẩm</h2>
    <div class="row">
        <div class="col-md-3 mb-4" th:each="prod : ${products}">
            <div class="card h-100 shadow-sm">
                <img th:src="${prod.imageUrl}" class="card-img-top" style="height: 200px; object-fit: cover;">
                <div class="card-body">
                    <h5 class="card-title" th:text="${prod.name}">Tên SP</h5>
                    <p class="text-danger fw-bold"
                       th:text="${#numbers.formatDecimal(prod.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></p>

                    <a th:href="@{/product-detail/{id}(id=${prod.id})}" class="btn btn-primary w-100">Xem ngay</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
