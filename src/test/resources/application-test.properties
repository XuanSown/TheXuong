# Test profile configuration
spring.application.name=TheXuong-Test

# Use dynamic Testcontainers database connection
# (Configured in BaseIntegrationTest.java)

# Logging
logging.level.org.testcontainers=INFO
logging.level.org.springframework.test.context=WARN

# Ignore Mail and Cloudflare R2 configurations in test
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test

# JWT Auth Test
app.security.jwt.secret=test-secret-key-that-is-long-enough-for-hs256-1234567890
app.security.jwt.access-ttl-seconds=900
app.security.jwt.refresh-ttl-seconds=604800
app.security.jwt.cookie-secure=false

# Cloudflare Mock
CF_R2_ACCESS_KEY=mock-access
CF_R2_SECRET_KEY=mock-secret