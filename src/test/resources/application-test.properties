# H2 in-memory cho @DataJpaTest; tach biet SQL Server prod
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MSSQLServer
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# ponytail: @DataJpaTest macro both ghi đe datasource mac dinh -> phai tat thay the
# de duoc url jdbc:h2:mem:testdb;MODE=MSSQLServer (boolean = 1 comparability).
spring.test.database.replace=none